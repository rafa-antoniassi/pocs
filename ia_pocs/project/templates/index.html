<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Formulário Seguro AES</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 2rem auto;
      background: #f9f9f9;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 0 10px #ccc;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.25rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.75rem;
      width: 100%;
      background: #007bff;
      border: none;
      color: white;
      font-size: 1.1rem;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h2>Formulário Seguro AES</h2>
  <label for="nome">Nome:</label>
  <input type="text" id="nome" placeholder="Digite seu nome" />

  <label for="idade">Idade:</label>
  <input type="number" id="idade" placeholder="Digite sua idade" />

  <label for="obs">Observação:</label>
  <textarea id="obs" rows="4" placeholder="Escreva uma observação"></textarea>

  <button onclick="send()">Enviar</button>

  <script src="/static/script.js"></script>
</body>
</html>
